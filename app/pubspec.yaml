name: pieno
description: "Pieno — prezzi carburanti, Italia. Quattro schermate: Accesso, Mappa, Vicino a te, Impostazioni."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Stack da linee-guida/06-architettura.md. Tutte dipendenze gratuite e sostituibili.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # stato condiviso mappa/elenco
  http: ^1.2.0                    # scaricamento file di provincia da CDN
  path_provider: ^2.1.3          # cartella locale per l'ultima zona
  geolocator: ^12.0.0            # un solo GPS fix, precisione "bilanciata"
  url_launcher: ^6.3.0           # «Portami qui» apre il navigatore di sistema
  maplibre_gl: ^0.26.0           # mappa vettoriale (pag. 6, 10); tile OpenFreeMap
  shared_preferences: ^2.3.0     # persistenza locale delle impostazioni
  # Archivio locale: il PDF indica "Drift o Isar". Scelta rimandata alla Tappa 03;
  # per lo scheletro basta la cache su file (data/local_store.dart).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Icona applicazione (launcher). Genera le icone native con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
    - assets/icons/
    - assets/icons/caricamento/
  # Font di pag. 4: Sora per numeri e prezzi (cifre tabulari), Manrope per il resto.
  # Sono i file VARIABILI ufficiali (asse wght): un solo .ttf per famiglia copre tutti
  # i pesi usati in design/typography.dart, quindi qui non si dichiara `weight`.
  # Licenza SIL Open Font License, testo in assets/fonts/OFL-*.txt.
  fonts:
    - family: Sora
      fonts:
        - asset: "assets/fonts/Sora[wght].ttf"
    - family: Manrope
      fonts:
        - asset: "assets/fonts/Manrope[wght].ttf"
