name: pieno
description: "Pieno — prezzi carburanti, Italia. Scheletro dell'app (Roadmap 02)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Stack da linee-guida/06-architettura.md. Tutte dipendenze gratuite e sostituibili.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # stato condiviso mappa/elenco
  http: ^1.2.0                    # scaricamento file di provincia da CDN
  path_provider: ^2.1.3          # cartella locale per l'ultima zona
  geolocator: ^12.0.0            # un solo GPS fix, precisione "bilanciata"
  url_launcher: ^6.3.0           # «Portami qui» apre il navigatore di sistema
  # Archivio locale: il PDF indica "Drift o Isar". Scelta rimandata alla Tappa 03;
  # per lo scheletro basta la cache su file (data/local_store.dart).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Font Sora e Manrope (pag. 4): DA ATTIVARE quando i .ttf sono in assets/fonts/.
  # Per lo scheletro (Tappa 02) restano commentati: l'app gira con i font di sistema.
  # Vedi assets/fonts/README.md per i file attesi. Poi togli il commento qui sotto.
  # fonts:
  #   - family: Sora
  #     fonts:
  #       - asset: assets/fonts/Sora-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/Sora-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Sora-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Sora-SemiBold.ttf
  #         weight: 600
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Manrope-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Manrope-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Manrope-ExtraBold.ttf
  #         weight: 800
